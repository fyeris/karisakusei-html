<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detail | フェリス</title>
<meta name="theme-color" content="#060a1a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23060a1a'/%3E%3Ctext x='32' y='43' font-size='30' font-weight='700' text-anchor='middle' fill='%2300e5ff' font-family='Arial'%3EF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
:root{--bg:#060a1a;--ink:#e8f1ff;--dim:#8da2c8;--c1:#00e5ff;--c2:#ff2bd6;--c3:#ffb800;
  --display:'Syne','Arial Black',system-ui,sans-serif;--body:'Space Grotesk','Hiragino Sans','Noto Sans JP',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.8;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--c1);outline-offset:3px}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
body::after{content:"";position:fixed;inset:0;z-index:29;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;
  padding:14px clamp(16px,4vw,48px);background:linear-gradient(var(--bg),transparent);backdrop-filter:blur(6px)}
.logo{font-family:var(--display);font-size:1.5rem;text-shadow:0 0 12px var(--c1)}
.back{padding:8px 20px;border:1px solid var(--c1);color:var(--c1);border-radius:999px;transition:.25s;box-shadow:0 0 16px rgba(0,229,255,.25)}
.back:hover{background:var(--c1);color:var(--bg);box-shadow:0 0 30px var(--c1)}
main{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:130px clamp(18px,5vw,40px) 40px}
.sub{color:var(--c3);font-size:.95rem}
h1{font-size:clamp(2.4rem,9vw,5rem);line-height:1.05;margin:6px 0 18px;font-family:var(--display);font-weight:800;
  text-shadow:0 0 36px rgba(0,229,255,.3)}
.lead{font-size:clamp(1.05rem,2.4vw,1.3rem);color:#cfdcf5;max-width:40ch}
dl{display:grid;grid-template-columns:auto 1fr;gap:12px 22px;margin:34px 0;padding:24px;border:1px solid rgba(0,229,255,.25);
  background:rgba(11,18,48,.65);backdrop-filter:blur(6px);border-radius:14px;box-shadow:0 0 30px rgba(0,229,255,.08)}
dt{color:var(--c3)} dd{color:var(--ink)}
h2{font-family:var(--display);font-size:1.5rem;margin:34px 0 10px;display:flex;align-items:center;gap:14px}
h2::after{content:"";height:2px;flex:1;background:linear-gradient(90deg,var(--c1),var(--c2),transparent)}
.body p{color:#c4d3ef;max-width:62ch;margin-bottom:14px}
.body ul{margin:0 0 14px 1.2em;color:#c4d3ef;max-width:62ch}
.pager{display:flex;flex-wrap:wrap;gap:12px}
.pager a{padding:10px 20px;border:1px solid var(--c2);color:var(--c2);border-radius:10px;transition:.25s}
.pager a:hover{background:var(--c2);color:var(--bg);box-shadow:0 0 28px var(--c2);transform:translateY(-3px)}
footer{position:relative;z-index:1;text-align:center;padding:50px 16px 70px;color:var(--dim);font-size:.85rem}
@media(max-width:560px){dl{grid-template-columns:1fr;gap:2px}dt{margin-top:10px}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<header><a class="logo" href="index.html" aria-label="フェリス">F</a><a class="back" href="index.html#profile">← 戻る</a></header>

<main>
  <p class="sub" id="sub"></p>
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>
  <dl id="facts"></dl>
  <div class="body" id="body"></div>
  <h2>Other profile</h2>
  <div class="pager" id="pager"></div>
  <noscript><p>このページの表示にはJavaScriptが必要です。</p></noscript>
</main>
<footer>© 2026 フェリス</footer>

<script>
/* ===== 詳細ページの内容: ここを書き換えるだけで編集できます ===== */
const D = {
  name: {
    title: '名前', sub: 'Name', pager: '名前',
    lead: 'フェリス。ネットではこの名前で活動しています。',
    facts: [['呼び名', 'フェリス'], ['肩書き', 'Chaos Developer（自称）'], ['活動の場', 'このページ、ゲーム、コードの世界']],
    body: [
      ['p', 'フェリスという名前で、コードを書いたりゲームを遊んだりしています。ハンドルネームなので、呼ぶときは「フェリス」で大丈夫です。'],
      ['p', '肩書きの「Chaos Developer」は、このページの背景にも使っているカオス理論が好きなことからつけた自称です。'],
      ['h', 'ひとこと'],
      ['p', '気になることがあれば、Contactのメールやリンクから気軽に連絡してください。']
    ]
  },
  university: {
    title: '所属', sub: 'University', pager: '所属',
    lead: '大学に通う学生です。学びながら、個人でもコードを書いています。',
    facts: [['所属', '大学'], ['立場', '学生'], ['学部・学年', '準備中'], ['学んでいること', '準備中']],
    body: [
      ['p', '大学で学びながら、空いた時間にコードを書いています。授業で得た知識が、趣味の制作に役立つこともあります。'],
      ['h', 'いま力を入れていること'],
      ['ul', ['授業と課題を進めること', '個人で小さなアプリやアニメーションを作ること', '新しい技術を試して、動かしてみること']]
    ]
  },
  coding: {
    title: '趣味：コード打ち', sub: 'Coding', pager: 'コード打ち',
    lead: '思いついたものを、とりあえず書いて動かしてみるのが好きです。',
    facts: [['よく使う言語', 'JavaScript / Python'], ['作るもの', 'Canvasのアニメーション、小さなツール'], ['好きな分野', 'ジェネラティブアート、シミュレーション'], ['このページ', 'HTML / CSS / JavaScriptだけで作成']],
    body: [
      ['p', 'エディタを開いて、まず動くものを作ってみる。それがいちばん楽しい時間です。画面の中で何かが動くと、それだけで嬉しくなります。'],
      ['h', 'よく作るもの'],
      ['ul', ['ブラウザで動くアニメーションやゲーム', '日常を少し楽にする小さなツール', 'カオス理論や物理を使ったシミュレーション']],
      ['h', 'このページについて'],
      ['p', '背景はローレンツ方程式という微分方程式で動いています。初期値がほんの少し違うだけで、軌道が大きく変わっていく様子が見られます。']
    ]
  },
  roblox: {
    title: 'ゲーム：Roblox', sub: 'Roblox', pager: 'Roblox',
    lead: '世界中のユーザーが作ったゲームを遊べるプラットフォームです。',
    facts: [['種類', 'ゲーム制作・プレイのプラットフォーム'], ['遊び方', 'ユーザーが作った多彩なゲームを探して遊ぶ'], ['制作', 'Roblox Studio / Luau（スクリプト言語）'], ['興味', '遊ぶだけでなく、作る側']],
    body: [
      ['p', 'Robloxは、ユーザー自身がゲームを作って公開できるのが大きな特徴です。ジャンルがとても幅広く、見つけるたびに新しい体験があります。'],
      ['h', 'Robloxの好きなところ'],
      ['ul', ['ジャンルが多く、遊ぶものに困らない', '友達と気軽に同じ世界で遊べる', '自分でも作れて、コードの勉強につながる']],
      ['p', 'コードを書くのが好きなので、いつかRoblox Studioで自分のゲームを作ってみたいと思っています。']
    ]
  },
  ff14: {
    title: 'ゲーム：FF14', sub: 'FINAL FANTASY XIV', pager: 'FF14',
    lead: 'ファイナルファンタジーXIV。広いオンラインの世界を冒険しています。',
    facts: [['タイトル', 'ファイナルファンタジーXIV'], ['ジャンル', 'MMORPG（オンラインRPG）'], ['開発・販売', 'スクウェア・エニックス'], ['楽しみ方', 'ストーリー、冒険、仲間との時間']],
    body: [
      ['p', 'FF14は、大勢のプレイヤーが同じ世界で冒険するオンラインRPGです。物語を進めるのも、仲間とコンテンツに挑むのも楽しい作品です。'],
      ['h', 'FF14の好きなところ'],
      ['ul', ['ストーリーが長く、世界観に浸れる', '音楽や景色が美しい', 'フレンドと一緒に遊べる']],
      ['p', 'ジョブやワールドなどの詳しいプレイ情報は、今後ここに追記する予定です。']
    ]
  }
};
/* ============================================================= */

(() => {
  const $ = s => document.querySelector(s);
  const id = new URLSearchParams(location.search).get('id');
  const d = D[id] || D.name, cur = D[id] ? id : 'name';
  document.title = d.title + ' | フェリス';
  $('#sub').textContent = d.sub; $('#title').textContent = d.title; $('#lead').textContent = d.lead;
  const el = (tag, txt) => { const e = document.createElement(tag); e.textContent = txt; return e; };
  d.facts.forEach(([k, v]) => { $('#facts').append(el('dt', k), el('dd', v)); });
  d.body.forEach(([type, v]) => {
    const b = $('#body');
    if (type === 'p') b.append(el('p', v));
    else if (type === 'h') b.append(el('h2', v));
    else { const ul = document.createElement('ul'); v.forEach(t => ul.append(el('li', t))); b.append(ul); }
  });
  Object.keys(D).filter(k => k !== cur).forEach(k => {
    const a = el('a', D[k].pager); a.href = 'detail.html?id=' + k; $('#pager').append(a);
  });

  /* ---------- Lorenz background ---------- */
  const cv = $('#bg'), c = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, mx = -999, my = -999, t = 0, last = performance.now();
  const tr = Array.from({ length: 6 }, (_, i) => ({ x: 1 + i * .02, y: 1, z: 20, px: null, py: null }));
  const lor = p => {
    const dt = .006, dx = 10 * (p.y - p.x), dy = p.x * (28 - p.z) - p.y, dz = p.x * p.y - 8 / 3 * p.z;
    p.x += dx * dt; p.y += dy * dt; p.z += dz * dt;
    if (!isFinite(p.x) || Math.abs(p.x) > 100) { p.x = 1; p.y = 1; p.z = 20; }
  };
  tr.forEach(p => { for (let k = 0; k < 400; k++) lor(p); });
  function resize() {
    const r = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = W * r; cv.height = H * r; c.setTransform(r, 0, 0, r, 0, 0);
    c.fillStyle = '#060a1a'; c.fillRect(0, 0, W, H); tr.forEach(p => p.px = null);
  }
  addEventListener('resize', resize); resize();
  addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; });
  function frame(now) {
    t += Math.min((now - last) / 1000, .05) * (reduce ? .3 : 1); last = now;
    c.globalCompositeOperation = 'source-over'; c.fillStyle = 'rgba(6,10,26,.1)'; c.fillRect(0, 0, W, H);
    c.globalCompositeOperation = 'lighter'; c.lineWidth = 1.3; c.lineCap = 'round';
    const a = t * .12, ca = Math.cos(a), sa = Math.sin(a), s = Math.min(W / 45, H / 55) * 1.1, cx = W * (W > 800 ? .7 : .5), cy = H * .55;
    tr.forEach((p, i) => {
      c.strokeStyle = `hsla(${185 + i * 25},100%,60%,.7)`; c.beginPath();
      for (let k = 0; k < (reduce ? 1 : 3); k++) {
        lor(p);
        let sx = cx + (p.x * ca + p.y * sa) * s, sy = cy - ((p.z - 25) * .9 + (-p.x * sa + p.y * ca) * .35) * s;
        const dx = sx - mx, dy = sy - my, d = Math.hypot(dx, dy);
        if (d < 140 && d > 0) { const q = (1 - d / 140) * 40; sx += dx / d * q; sy += dy / d * q; }
        if (p.px === null) { p.px = sx; p.py = sy; }
        c.moveTo(p.px, p.py); c.lineTo(sx, sy); p.px = sx; p.py = sy;
      }
      c.stroke();
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
